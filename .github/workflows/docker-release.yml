name: Docker Build, Scan, and Publish

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-release.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-release.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-scan-publish:
    name: Build, Scan & Publish Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------
      # 1. Build Local Images for Scanning
      # ----------------------------------------------------
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          load: true # Load image into local Docker daemon for scanning
          tags: kyreqo-backend:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: kyreqo-frontend:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------
      # 2. Security Scan with Trivy (SHA Pinned to v0.35.0)
      # ----------------------------------------------------
      - name: Run Trivy Vulnerability Scanner on Backend
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: "kyreqo-backend:local"
          format: "table"
          exit-code: "1" # Fails the pipeline if vulnerabilities are found
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Run Trivy Vulnerability Scanner on Frontend
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: "kyreqo-frontend:local"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      # ----------------------------------------------------
      # 3. Publish to GitHub Container Registry (Main branch only)
      # ----------------------------------------------------
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercased repository owner
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: repo
        run: |
          echo "owner_lowercase=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Push Backend Image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner_lowercase }}/kyreqo-backend:latest
            ghcr.io/${{ steps.repo.outputs.owner_lowercase }}/kyreqo-backend:${{ github.sha }}
          cache-from: type=gha

      - name: Push Frontend Image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner_lowercase }}/kyreqo-frontend:latest
            ghcr.io/${{ steps.repo.outputs.owner_lowercase }}/kyreqo-frontend:${{ github.sha }}
          cache-from: type=gha
