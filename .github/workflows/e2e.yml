name: Kyreqo E2E Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  deployment_status:

permissions:
  contents: read

jobs:
  e2e-tests:
    name: e2e-tests
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install PNPM
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Set Base URL for Deployment Status
        if: github.event_name == 'deployment_status'
        run: echo "BASE_URL=${{ github.event.deployment_status.target_url }}" >> $GITHUB_ENV

      - name: Log Target URL
        run: echo "Testing against URL: ${BASE_URL:-http://localhost:3000}"

      - name: Run Playwright E2E Tests
        run: pnpm frontend:test:e2e --project=chromium

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
